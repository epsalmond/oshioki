[package]
name = "oshioki-plugin"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

# cdylib: the approval plugin sudo dlopens. No binaries.

[lib]
crate-type = ["cdylib"]

# The plugin runs inside sudo's process. Keep the binary lean and forbid
# leaking allocation across the FFI boundary.

[dependencies]
libc = { workspace = true }
nix = { workspace = true }
oshioki-protocol = { path = "../protocol" }
serde_json = { workspace = true }
tracing = { workspace = true }

# Inherit workspace lints. The plugin's extra alloc/ffi denials live as
# `#![deny(...)]` attributes in src/lib.rs, since a manifest cannot combine
# `lints.workspace` with per-table overrides.
[lints]
workspace = true
