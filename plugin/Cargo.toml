[package]
name = "oshioki-plugin"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

# cdylib: the approval plugin sudo dlopens. No binaries.

[lib]
crate-type = ["cdylib"]

# The plugin runs inside sudo's process. Keep the binary lean.

[dependencies]
libc = { workspace = true }
nix = { workspace = true }
oshioki-protocol = { path = "../protocol" }
serde_json = { workspace = true }
tracing = { workspace = true }

# Inherit workspace lints. The source also sets Clippy rules that prefer
# `core` and `alloc` imports where possible. They do not govern FFI ownership.
[lints]
workspace = true
