[package]
name = "oshioki-server"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

# Binary: the approval service. NATS relay, ntfy broker, HTTP page, enrollment.

[[bin]]
name = "oshioki-server"
path = "src/main.rs"

[dependencies]
oshioki-protocol = { path = "../protocol" }
oshioki-transport = { path = "../transport" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
web-push-native = { path = "../vendor/web-push-native", default-features = false, features = ["serialization"] }
jwt-compact = { git = "https://github.com/slowli/jwt-compact", rev = "6b410eeff261738123d6993388183fde66df5e26", default-features = false, features = ["clock", "p256"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
p256 = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
p256 = { workspace = true }
ciborium = { workspace = true }
tower = { version = "0.5", features = ["util"] }
