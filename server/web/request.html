<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudo approval</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="request">
  <main>
    <h1>Sudo approval</h1>
    <p id="status">Loading encrypted request…</p>
    <dl id="request" hidden>
      <dt>Host</dt><dd id="host"></dd><dt>User / UID</dt><dd id="user"></dd>
      <dt>Command</dt><dd id="command"></dd><dt>Arguments</dt><dd id="argv"></dd>
      <dt>Working directory</dt><dd id="cwd"></dd><dt>Process chain</dt><dd id="process-chain"></dd>
    </dl>
    <div id="actions" hidden><button id="approve" type="button">Approve</button><button id="deny" type="button">Deny</button></div>
  </main>
  <script src="/assets/libsodium.js"></script><script src="/assets/app.js"></script>
</body>
</html>
