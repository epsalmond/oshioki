[workspace]
resolver = "2"
members = [
    "protocol",
    "hook",
    "server",
    "plugin",
]

# All version numbers and shared features live here. Member crates reference
# them with `{ workspace = true }` so the entire workspace upgrades a
# dependency in one edit.

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
repository = "https://github.com/epsalmond/management-plane"
license = "proprietary"
publish = false

# Deny warnings workspace-wide; keep the supply chain tight. The plugin crate
# additionally forbids allocation across the FFI boundary in its own [lints].
# Crates opt in with `[lints] workspace = true` in their own manifest.

# Release profile. `lto` and `panic` can only be set at the workspace root;
# `opt-level` and `codegen-units` may be scoped per-package. Set everything
# here for one place to tune release artefacts, with the plugin's footprint
# driving the choices.
[profile.release]
lto = "thin"
panic = "abort"

[profile.release.package.plugin]
opt-level = "z"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Pedantic exceptions too noisy for this project.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
# Current transitive proc-macro dependencies require both syn major versions.
multiple_crate_versions = "allow"
# Deny these outright.
option_option = "deny"
unnecessary_wraps = "deny"

# Shared dependency versions and features.

[workspace.dependencies]
# Internal crates reference core directly by path (workspace-relative).

# Async runtime
tokio = { version = "1", features = ["full"] }
async-nats = { version = "0.38" }

# Crypto / auth
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = { version = "0.10" }
hmac = { version = "0.12" }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
rand = { version = "0.8" }
chacha20poly1305 = { version = "0.10" }
# coset = { version = "0.3" } # unused, we parse CBOR directly

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serde_cbor = { version = "0.11" }

# HTTP
axum = { version = "0.7", features = ["http1", "tokio", "json"] }
tower = { version = "0.4" }

# CLI
clap = { version = "4", features = ["derive"] }

# Errors
thiserror = { version = "2" }
anyhow = { version = "1" }

# FFI / plugin
libc = { version = "0.2" }
nix = { version = "0.29", features = ["process", "fs", "user"] }

# Misc
base64 = { version = "0.22" }
time = { version = "0.3", features = ["serde", "std"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
uuid = { version = "1", features = ["v4"] }

# Async utilities
futures = { version = "0.3" }
rusqlite = { version = "0.32", features = ["bundled"] }

# Test-only
assert_cmd = { version = "2" }
