[package]
name = "oshioki-agent"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
description = "Native approval agent: holds the device keys, watches for sudo requests, and signs approvals"

[[bin]]
name = "oshioki-agent"
path = "src/main.rs"

[features]
# `run --auto approve|deny` decides every request without a prompt. Only the
# E2E build turns this on; a release agent has no such flag to reach for.
unattended = []

[dependencies]
oshioki-protocol = { path = "../protocol" }
tokio = { workspace = true }
async-nats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
p256 = { workspace = true }
x25519-dalek = { workspace = true }
sha2 = { workspace = true }
futures = { workspace = true }
time = { workspace = true }

# The Secure Enclave backend and the Touch ID sheet. Linux builds, including
# the Compose E2E and the container image, never see it.
[target.'cfg(target_os = "macos")'.dependencies]
oshioki-enclave = { path = "../enclave" }

[lints]
workspace = true
