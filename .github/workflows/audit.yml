name: audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New advisories land over time; catch them even without code changes.
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
