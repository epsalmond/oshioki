name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_apt_repository:
        description: Publish the apt repository from stable release assets (bootstrap or rebuild)
        type: boolean
        required: true
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      source_commit: ${{ steps.version.outputs.source_commit }}
      tag_object: ${{ steps.version.outputs.tag_object }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
            scripts/verify-release-tag "$tag" >"$RUNNER_TEMP/release-source.json"
            {
              echo "version=$(jq -r .version "$RUNNER_TEMP/release-source.json")"
              echo "source_commit=$(jq -r .source_commit "$RUNNER_TEMP/release-source.json")"
              echo "tag_object=$(jq -r .tag_object "$RUNNER_TEMP/release-source.json")"
              echo "publish=true"
            } >>"$GITHUB_OUTPUT"
          else
            cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            {
              echo "version=$cargo_version"
              echo "source_commit=$(git rev-parse HEAD)"
              echo "publish=false"
            } >>"$GITHUB_OUTPUT"
          fi

  build-deb:
    needs: gate
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_apt_repository }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact source before building
        if: github.event_name == 'push'
        env:
          SOURCE_COMMIT: ${{ needs.gate.outputs.source_commit }}
          TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
        run: scripts/verify-release-tag "${GITHUB_REF#refs/tags/}" "$SOURCE_COMMIT" "$TAG_OBJECT" >"$RUNNER_TEMP/build-deb-source.json"
      - run: rustup show active-toolchain
      # Release runs on tag refs, which cannot share caches with each other, so
      # this restores the default branch's cache and never writes. Only
      # dependencies are cached; workspace crates rebuild from the tagged source.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: compat-upgrade
          save-if: false
      # The oshioki-pam workspace member links libpam.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libpam0g-dev
      - run: cargo build --locked --release -p oshioki-hook -p oshioki-server -p oshioki-plugin -p oshioki-pam -p oshioki-browser-relay
      - run: |
          mkdir -p stage
          install -m 0755 target/release/oshioki target/release/oshioki-server target/release/oshioki-browser-relay stage/
          install -m 0755 scripts/oshioki-google-login-setup scripts/oshioki-browser-service stage/
          install -m 0644 target/release/liboshioki_plugin.so stage/
          install -m 0644 target/release/liboshioki_pam.so stage/
          (cd stage && sha256sum oshioki liboshioki_plugin.so liboshioki_pam.so oshioki-browser-relay oshioki-google-login-setup oshioki-browser-service > SHA256SUMS)
          ./packaging/build-deb stage "${{ needs.gate.outputs.version }}" \
            "oshioki_${{ needs.gate.outputs.version }}_amd64.deb"
      - name: Verify the packaged browser helper
        run: |
          verify="$(mktemp -d)"
          dpkg-deb --extract "oshioki_${{ needs.gate.outputs.version }}_amd64.deb" "$verify"
          scripts/test-browser-relay-package "$verify/usr/bin/oshioki-browser-relay" \
            "$verify/usr/share/oshioki/SHA256SUMS" --with-installers
      - run: sudo apt-get install --yes --no-install-recommends nats-server
      - run: scripts/test-browser-relay
      - name: Stage verified source identity with package
        if: github.event_name == 'push'
        run: cp "$RUNNER_TEMP/build-deb-source.json" build-deb-source.json
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: |
            oshioki_*_amd64.deb
            build-deb-source.json

  build-mac:
    needs: gate
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_apt_repository }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact source before building
        if: github.event_name == 'push'
        env:
          SOURCE_COMMIT: ${{ needs.gate.outputs.source_commit }}
          TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
        run: scripts/verify-release-tag "${GITHUB_REF#refs/tags/}" "$SOURCE_COMMIT" "$TAG_OBJECT" >"$RUNNER_TEMP/build-mac-source.json"
      - run: rustup show active-toolchain
      # No compat job builds for macOS, so only a manual run on main writes
      # this cache; tag runs restore it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-macos-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/build-darwin-artifact dist
      # COPYFILE_DISABLE keeps bsdtar from writing ._ AppleDouble members for
      # extended attributes. Inside Oshioki.app those would be unsealed
      # contents and `codesign --verify` on the poured bundle would fail.
      - run: |
          COPYFILE_DISABLE=1 tar -czf "oshioki-macos-arm64-${{ needs.gate.outputs.version }}.tar.gz" -C dist \
            oshioki oshioki.dylib liboshioki_pam.dylib oshioki-agent oshioki-server oshioki-browser-relay install-oshioki-hook oshioki-laptop-setup oshioki-phone-setup oshioki-google-login-setup oshioki-browser-service manifest.json SHA256SUMS Oshioki.app
          tar -tzf "oshioki-macos-arm64-${{ needs.gate.outputs.version }}.tar.gz" | sort
      # What the tar step produced is what a brew user actually pours, so the
      # bundle is checked after the round trip rather than only in the
      # staging directory: a tar that dropped the _CodeSignature seal or an
      # AppleDouble member that unsealed it would otherwise ship.
      - run: |
          verify="$(mktemp -d)"
          tar -xzf "oshioki-macos-arm64-${{ needs.gate.outputs.version }}.tar.gz" -C "$verify"
          scripts/test-browser-relay-package "$verify/oshioki-browser-relay" "$verify/SHA256SUMS" --with-installers
          cd "$verify"
          codesign --verify --strict --verbose=1 oshioki-browser-relay
          file oshioki-browser-relay | grep -q 'arm64'
          codesign --verify --deep --strict --verbose=1 Oshioki.app
          grep -E '  (oshioki-agent|Oshioki\.app/Contents/MacOS/oshioki-agent)$' SHA256SUMS \
            > agent-sums
          test "$(wc -l < agent-sums)" -eq 2
          shasum -a 256 -c agent-sums
          file Oshioki.app/Contents/MacOS/oshioki-agent | grep -q 'arm64'
      - run: brew install nats-server
      - run: scripts/test-browser-relay
      - name: Stage verified source identity with package
        if: github.event_name == 'push'
        run: cp "$RUNNER_TEMP/build-mac-source.json" build-mac-source.json
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            oshioki-macos-arm64-*.tar.gz
            build-mac-source.json

  compat:
    needs: gate
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_apt_repository }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact source before building
        if: github.event_name == 'push'
        env:
          SOURCE_COMMIT: ${{ needs.gate.outputs.source_commit }}
          TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
        run: scripts/verify-release-tag "${GITHUB_REF#refs/tags/}" "$SOURCE_COMMIT" "$TAG_OBJECT" >"$RUNNER_TEMP/compat-source.json"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: compat-upgrade
          save-if: false
          cache-directories: ${{ runner.temp }}/compat-prev-target
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libpam0g-dev
      - run: cargo test --workspace --locked
      - run: scripts/test-nats-lane-upgrade
      - run: scripts/test-compat-upgrade
        env:
          OSHIOKI_COMPAT_PREV_TARGET: ${{ runner.temp }}/compat-prev-target

  release:
    needs: [gate, build-deb, build-mac, compat]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recheck tag identity before publication
        env:
          SOURCE_COMMIT: ${{ needs.gate.outputs.source_commit }}
          TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
        run: scripts/verify-release-tag "${GITHUB_REF#refs/tags/}" "$SOURCE_COMMIT" "$TAG_OBJECT" >"$RUNNER_TEMP/release-source.json"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Bind packages to verified source
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
          APT_SIGNING_KEY_FINGERPRINT: ${{ vars.APT_SIGNING_KEY_FINGERPRINT }}
        run: |
          cmp "$RUNNER_TEMP/release-source.json" artifacts/build-deb-source.json
          cmp "$RUNNER_TEMP/release-source.json" artifacts/build-mac-source.json
          test -n "$APT_SIGNING_PRIVATE_KEY"
          test -n "$APT_SIGNING_KEY_FINGERPRINT"
          umask 077
          key="$RUNNER_TEMP/oshioki-provenance-key.asc"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$APT_SIGNING_PRIVATE_KEY" >"$key"
          (cd artifacts && sha256sum oshioki_*_amd64.deb oshioki-macos-arm64-*.tar.gz > SHA256SUMS)
          scripts/release-provenance sign "$key" "$APT_SIGNING_KEY_FINGERPRINT" \
            "$RUNNER_TEMP/release-source.json" artifacts
      - run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "Oshioki ${GITHUB_REF#refs/tags/}" \
            --notes "See CHANGELOG.md for what is in this release." \
            artifacts/oshioki_*_amd64.deb "artifacts/oshioki-macos-arm64-${{ needs.gate.outputs.version }}.tar.gz" artifacts/SHA256SUMS artifacts/RELEASE-PROVENANCE.json.asc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  apt-repository:
    needs: [gate, release]
    if: >-
      ${{ always() && needs.gate.result == 'success' &&
          ((github.event_name == 'push' && needs.gate.outputs.publish == 'true' &&
            needs.release.result == 'success') ||
           (github.event_name == 'workflow_dispatch' && inputs.publish_apt_repository)) }}
    runs-on: ubuntu-24.04
    concurrency:
      group: oshioki-apt-repository
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: branch
        name: Restrict manual bootstrap to the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            {
              echo "APT repository bootstrap skipped. Run this workflow from the default branch ($DEFAULT_BRANCH)."
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          fi
      - id: signing
        name: Check signing configuration
        if: steps.branch.outputs.enabled == 'true'
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
          APT_SIGNING_KEY_FINGERPRINT: ${{ vars.APT_SIGNING_KEY_FINGERPRINT }}
        run: |
          if [ -z "$APT_SIGNING_PRIVATE_KEY" ] && [ -z "$APT_SIGNING_KEY_FINGERPRINT" ]; then
            echo "configured=false" >>"$GITHUB_OUTPUT"
            echo "APT repository publishing skipped: configure APT_SIGNING_PRIVATE_KEY and APT_SIGNING_KEY_FINGERPRINT first." >>"$GITHUB_STEP_SUMMARY"
          elif [ -z "$APT_SIGNING_PRIVATE_KEY" ] || [ -z "$APT_SIGNING_KEY_FINGERPRINT" ]; then
            echo "Both APT signing settings are required; partial configuration is invalid." >&2
            exit 1
          else
            echo "configured=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.signing.outputs.configured == 'true'
      - name: Install repository tooling
        if: steps.signing.outputs.configured == 'true'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends dpkg-dev gnupg jq
      - name: Write signing key to temporary file
        if: steps.signing.outputs.configured == 'true'
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$APT_SIGNING_PRIVATE_KEY" >"$RUNNER_TEMP/oshioki-apt-signing-key.asc"
      - name: Build signed repository from stable releases
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY_FINGERPRINT: ${{ vars.APT_SIGNING_KEY_FINGERPRINT }}
        run: |
          scripts/build-apt-repository \
            --output-dir "$RUNNER_TEMP/oshioki-apt-site" \
            --signing-key "$RUNNER_TEMP/oshioki-apt-signing-key.asc" \
            --fingerprint "$APT_SIGNING_KEY_FINGERPRINT"
      - uses: actions/upload-pages-artifact@v3
        if: steps.signing.outputs.configured == 'true'
        with:
          path: ${{ runner.temp }}/oshioki-apt-site
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.signing.outputs.configured == 'true'
      - name: Report repository publication
        if: steps.signing.outputs.configured == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "Published the signed apt repository at $PAGE_URL"
            echo "Fingerprint: $(cat "$RUNNER_TEMP/oshioki-apt-site/KEY-FINGERPRINT")"
          } >>"$GITHUB_STEP_SUMMARY"
