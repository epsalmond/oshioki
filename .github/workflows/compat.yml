name: compat

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/test-google-login-setup
      - run: python3 scripts/test-browser-service

  goldens:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show active-toolchain
      # Caches dependencies only; workspace crates always rebuild. PRs restore
      # main's cache but never write one, which keeps eviction bounded.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: compat-goldens
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libpam0g-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm --prefix server/web ci
      - run: npm --prefix server/web test

  upgrade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: compat-upgrade
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # test-compat-upgrade builds the previous release in a temp worktree;
          # OSHIOKI_COMPAT_PREV_TARGET (set below) puts that build here.
          cache-directories: ${{ runner.temp }}/compat-prev-target
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libpam0g-dev
      - name: NATS lane repair
        run: scripts/test-nats-lane-upgrade
      - name: Mixed-version upgrade
        run: scripts/test-compat-upgrade
        env:
          OSHIOKI_COMPAT_PREV_TARGET: ${{ runner.temp }}/compat-prev-target
