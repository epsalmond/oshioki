name: apt-repository-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  apt-repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install repository test tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends curl dpkg-dev gnupg jq
      - run: scripts/test-apt-repository
