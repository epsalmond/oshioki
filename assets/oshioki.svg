<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c1f26"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </radialGradient>

    <!-- Biometric Sensor Ring Glow -->
    <linearGradient id="sensorBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="50%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>

    <!-- Hanko Vermilion Gradient -->
    <radialGradient id="stampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="70%" stop-color="#d70015"/>
      <stop offset="100%" stop-color="#8e0000"/>
    </radialGradient>

    <!-- Circuit Trace Stroke Gradient -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff453a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff453a" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow for Sensor Surface -->
    <filter id="recessedPlate" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .trace { stroke: #ff3b30; stroke-opacity: 0.25; stroke-width: 2; fill: none; stroke-linecap: round; }
    .node { fill: #ff3b30; fill-opacity: 0.4; }
    .sensor-ring { fill: none; stroke: url(#sensorBorder); stroke-width: 5; }
    .hash-core { fill: url(#stampGlow); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", monospace; font-weight: 900; font-size: 240px; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- Base Plate -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Background Data / SSH Circuit Traces (Representing Remote Link) -->
  <g class="circuit-layer">
    <path d="M 64 128 L 128 128 L 160 160" class="trace"/>
    <circle cx="64" cy="128" r="3" class="node"/>

    <path d="M 448 128 L 384 128 L 352 160" class="trace"/>
    <circle cx="448" cy="128" r="3" class="node"/>

    <path d="M 96 384 L 144 384 L 176 352" class="trace"/>
    <circle cx="96" cy="384" r="3" class="node"/>

    <path d="M 416 384 L 368 384 L 336 352" class="trace"/>
    <circle cx="416" cy="384" r="3" class="node"/>

    <path d="M 256 32 L 256 80" class="trace"/>
    <circle cx="256" cy="32" r="3" class="node"/>

    <path d="M 256 480 L 256 432" class="trace"/>
    <circle cx="256" cy="480" r="3" class="node"/>
  </g>

  <!-- Touch ID Outer Recessed Ring -->
  <circle cx="256" cy="256" r="172" fill="#12141a" filter="url(#recessedPlate)"/>
  <circle cx="256" cy="256" r="172" class="sensor-ring"/>
  <circle cx="256" cy="256" r="162" fill="none" stroke="#ff3b30" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Centered Root Privilege Symbol (#) -->
  <g filter="url(#neonGlow)">
    <text x="256" y="256" class="hash-core">#</text>
  </g>
</svg>
