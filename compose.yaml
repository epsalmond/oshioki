services:
  nats:
    image: nats:2.11-alpine
    command:
      - --jetstream
      - --user
      - sudo-approve
      - --pass
      - test-only
      - --http_port
      - "8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 1s
      timeout: 1s
      retries: 30

  nats-init:
    image: natsio/nats-box:0.18.0
    depends_on:
      nats:
        condition: service_healthy
    command:
      - sh
      - -eu
      - -c
      - >-
        nats --server nats://nats:4222 --user sudo-approve --password test-only
        stream info SUDO_APPROVE >/dev/null 2>&1 ||
        nats --server nats://nats:4222 --user sudo-approve --password test-only
        stream add SUDO_APPROVE --subjects 'sudo.request.>' --storage memory
        --retention limits --discard old --max-age 10m --defaults

  server:
    build:
      context: .
      target: server
    depends_on:
      nats-init:
        condition: service_completed_successfully
    user: "${SUDO_APPROVE_UID:?set SUDO_APPROVE_UID}"
    environment:
      NATS_URL: nats://nats:4222
      NATS_USER: sudo-approve
      NATS_PASS: test-only
      SUDO_APPROVE_STATE_PATH: /state/state.sqlite3
      SUDO_APPROVE_LISTEN: 0.0.0.0:8443
      SUDO_APPROVE_ORIGIN: https://sudo.test
      SUDO_APPROVE_RP_ID: sudo.test
      RUST_LOG: info
    volumes:
      - ${SUDO_APPROVE_STATE_ROOT:?set SUDO_APPROVE_STATE_ROOT}/server:/state
    ports:
      - 127.0.0.1:${SUDO_APPROVE_HTTP_PORT:-8443}:8443
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8443/healthz"]
      interval: 1s
      timeout: 2s
      retries: 45

  e2e:
    build:
      context: .
      target: e2e
    depends_on:
      server:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      NATS_USER: sudo-approve
      NATS_PASS: test-only
      SUDO_APPROVE_TEST_CONFIG_DIR: /state/hook
      SUDO_APPROVE_ORIGIN: https://sudo.test
      SUDO_APPROVE_RP_ID: sudo.test
      SUDO_APPROVE_SERVER_HTTP: http://server:8443
      SUDO_APPROVE_E2E_IN_CONTAINER: "1"
      SUDO_APPROVE_E2E_SKIP_BUILD: "1"
      SUDO_APPROVE_E2E_PREBUILT: "1"
      SUDO_APPROVE_HOST_UID: ${SUDO_APPROVE_HOST_UID:?set SUDO_APPROVE_HOST_UID}
    volumes:
      - ${SUDO_APPROVE_STATE_ROOT:?set SUDO_APPROVE_STATE_ROOT}/e2e:/state
    networks:
      default:
        aliases:
          - sudo.test
